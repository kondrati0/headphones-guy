name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64

      - name: Tracker tests
        run: |
          cd tests
          for t in test_tracker test_transitions test_chaos; do
            g++ -O2 -std=c++17 -I../src $t.cpp -o $t && ./$t
          done

      - name: Build exe
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HeadphonesGuy
          path: build/HeadphonesGuy.exe

      # Releases come from the VERSION file: bump it on main and the workflow tags and publishes vX.Y.Z.
      - name: Check version
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d ' \r\n' < VERSION)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Headphones Guy ${{ steps.ver.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: build/HeadphonesGuy.exe
          make_latest: true

      - name: Attach to release (manual tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/HeadphonesGuy.exe
          body_path: docs/RELEASE_NOTES.md
