name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64

      - name: Tracker tests
        run: |
          cd tests
          for t in test_tracker test_transitions test_chaos; do
            g++ -O2 -std=c++17 -I../src $t.cpp -o $t && ./$t
          done

      - name: Build exe
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HeadphonesGuy
          path: build/HeadphonesGuy.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/HeadphonesGuy.exe
          body_path: docs/RELEASE_NOTES.md
